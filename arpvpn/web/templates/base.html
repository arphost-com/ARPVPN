<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="ARPVPN: WireGuard management with client and site-to-site support." />
        <meta name="author" content="José Antonio Mazón San Bartolomé" />
        <meta name="theme-color" content="#0e1727" />
        <meta name="arpvpn-theme-choice" content="{{ server_theme_choice if server_theme_choice is defined else '' }}" />
        <meta name="arpvpn-csrf-token" content="{{ csrf_token() if csrf_token is defined else '' }}" />
        <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
        <link rel="icon" type="image/svg+xml" href="{{ asset_url('assets/img/favicon.svg') }}" />

        {% block additional_metas %}
        {% endblock %}

        <title>
            {{ app_name }} | {{ title }}
        </title>

        <script>
            (function () {
                const key = "arpvpn.theme";
                let value = "auto";
                try {
                    value = localStorage.getItem(key) || "auto";
                } catch (e) {}
                const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
                const resolved = value === "auto" ? (prefersDark ? "dark" : "light") : value;
                document.documentElement.setAttribute("data-theme", resolved);
                document.documentElement.setAttribute("data-theme-choice", value);
            })();
        </script>

        <link href="{{ asset_url('css/styles.css') }}" rel="stylesheet" />

        {% block additional_styles %}
        {% endblock %}
        <link href="{{ asset_url('css/theme-overrides.css') }}" rel="stylesheet" />

        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css" rel="stylesheet" crossorigin="anonymous" />
        {% block additional_prioritary_scripts %}
        {% endblock %}
    </head>
    <body>
        {% block body_content %}
        {% endblock %}

        {% block footer %}
        {% endblock %}

        {% block scripts %}
        {% endblock %}
    </body>
</html>
