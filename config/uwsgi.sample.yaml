uwsgi:
  master: true
  enable-threads: true
  processes: 1
  threads: 4
  chdir: /var/www/arpvpn
  venv: venv
  wsgi-file: arpvpn/__main__.py
  pyargv: data
  need-plugin: python3
  plugins: http
  callable: app
  die-on-term: true
  http: 0.0.0.0:8085
  http-keepalive: 1
  http-buffer-size: 65536
  offload-threads: 1
  buffer-size: 32768
  chmod-socket: 660
  vacuum: true
